apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-planner-frontend
  namespace: event-planner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-planner-frontend
  template:
    metadata:
      labels:
        app: event-planner-frontend
    spec:
      containers:
        - name: frontend
          image: event-planner-frontend:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: event-planner-frontend
  namespace: event-planner
spec:
  selector:
    app: event-planner-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: NodePort
