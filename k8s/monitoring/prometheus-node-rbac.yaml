apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-node-metrics-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-node-metrics-reader-binding
subjects:
  - kind: ServiceAccount
    name: default
    namespace: event-planner
roleRef:
  kind: ClusterRole
  name: prometheus-node-metrics-reader
  apiGroup: rbac.authorization.k8s.io
